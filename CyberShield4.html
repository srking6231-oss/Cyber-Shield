<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield — Security Event Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #070a12;
            --bg-2: #0c1220;
            --surface: #0f1626;
            --surface-2: #141e33;
            --border: #1e2c47;
            --border-bright: #2a3f63;
            --primary: #00d4ff;
            --primary-dim: #0098b8;
            --primary-glow: rgba(0, 212, 255, .25);
            --danger: #ff4d6d;
            --warn: #ffb347;
            --success: #4ade80;
            --info: #7c5cff;
            --text: #e6edf8;
            --text-dim: #8b9bb4;
            --text-mute: #5a6b85;
            --radius: 14px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --sans: 'Inter', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(0, 212, 255, .03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, .03) 1px, transparent 1px);
            background-size: 44px 44px;
            pointer-events: none;
            z-index: 0
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 0%, rgba(0, 212, 255, .09), transparent 45%), radial-gradient(circle at 90% 90%, rgba(255, 77, 109, .06), transparent 45%);
            pointer-events: none;
            z-index: 0
        }

        .app {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 264px 1fr;
            height: 100vh
        }

        /* ============ SIDEBAR ============ */
        .sidebar {
            background: rgba(12, 18, 32, .85);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto
        }

        .sidebar::-webkit-scrollbar {
            width: 6px
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border-bright);
            border-radius: 3px
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 22px 20px 18px;
            border-bottom: 1px solid var(--border)
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--info));
            border-radius: 10px;
            color: #001824;
            font-size: 20px;
            font-weight: 800;
            box-shadow: 0 0 24px var(--primary-glow)
        }

        .brand-name {
            font-weight: 800;
            font-size: 15px;
            letter-spacing: -.01em
        }

        .brand-sub {
            font-size: 10.5px;
            color: var(--text-mute);
            letter-spacing: .1em;
            text-transform: uppercase;
            font-weight: 500
        }

        .nav {
            padding: 14px 12px;
            flex: 1
        }

        .nav-section {
            font-size: 10px;
            color: var(--text-mute);
            letter-spacing: .14em;
            text-transform: uppercase;
            font-weight: 600;
            padding: 16px 10px 8px
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: .15s;
            border: 1px solid transparent;
            margin-bottom: 1px
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, .03);
            color: var(--text)
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(0, 212, 255, .14), rgba(0, 212, 255, .02));
            color: var(--primary);
            border-color: rgba(0, 212, 255, .2);
            box-shadow: inset 2px 0 0 var(--primary)
        }

        .nav-item .ico {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .sidebar-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-dim)
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        /* ============ MAIN ============ */
        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 32px;
            border-bottom: 1px solid var(--border);
            background: rgba(7, 10, 18, .5);
            backdrop-filter: blur(10px)
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.02em
        }

        .page-title span {
            color: var(--primary)
        }

        .topbar-actions {
            display: flex;
            gap: 10px
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px
        }

        .content::-webkit-scrollbar {
            width: 8px
        }

        .content::-webkit-scrollbar-thumb {
            background: var(--border-bright);
            border-radius: 4px
        }

        .content::-webkit-scrollbar-track {
            background: transparent
        }

        /* ============ BUTTONS ============ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            font-family: var(--sans);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-bright);
            background: var(--surface-2);
            color: var(--text);
            transition: .15s;
            text-decoration: none
        }

        .btn:hover {
            background: var(--border);
            border-color: var(--primary-dim);
            transform: translateY(-1px)
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #0090b8);
            border-color: transparent;
            color: #001824;
            box-shadow: 0 4px 16px var(--primary-glow)
        }

        .btn-primary:hover {
            box-shadow: 0 6px 24px var(--primary-glow);
            background: linear-gradient(135deg, #1ee0ff, #00a8d0)
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #d32f4a);
            border-color: transparent;
            color: #fff
        }

        .btn-ghost {
            background: transparent;
            border-color: var(--border)
        }

        .btn-sm {
            padding: 6px 11px;
            font-size: 12px
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none
        }

        /* ============ CARDS ============ */
        .card {
            background: linear-gradient(180deg, var(--surface), rgba(15, 22, 38, .6));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            transition: .2s
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .01em
        }

        .card-sub {
            font-size: 12px;
            color: var(--text-mute);
            margin-top: 2px
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px
        }

        .stat-card {
            background: linear-gradient(180deg, var(--surface), rgba(15, 22, 38, .5));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: .2s
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), transparent)
        }

        .stat-card.danger::before {
            background: linear-gradient(90deg, var(--danger), transparent)
        }

        .stat-card.warn::before {
            background: linear-gradient(90deg, var(--warn), transparent)
        }

        .stat-card.success::before {
            background: linear-gradient(90deg, var(--success), transparent)
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-mute);
            letter-spacing: .1em;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px
        }

        .stat-value {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -.02em;
            font-family: var(--mono)
        }

        .stat-value.small {
            font-size: 24px
        }

        .stat-foot {
            font-size: 11.5px;
            color: var(--text-dim);
            margin-top: 6px
        }

        /* ============ TABLE ============ */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--mono);
            font-size: 13px
        }

        .data-table th {
            text-align: left;
            padding: 10px 14px;
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-mute);
            letter-spacing: .1em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border)
        }

        .data-table td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(30, 44, 71, .5);
            color: var(--text-dim)
        }

        .data-table tr:hover td {
            background: rgba(0, 212, 255, .03);
            color: var(--text)
        }

        .data-table tr.highlight td {
            background: rgba(0, 212, 255, .1);
            color: var(--text);
            box-shadow: inset 2px 0 0 var(--primary)
        }

        .data-table td:first-child {
            color: var(--primary);
            font-weight: 600
        }

        /* ============ BADGES ============ */
        .sev-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 20px;
            font-family: var(--mono);
            font-size: 11.5px;
            font-weight: 600;
            border: 1px solid
        }

        .sev-low {
            background: rgba(74, 222, 128, .1);
            color: var(--success);
            border-color: rgba(74, 222, 128, .3)
        }

        .sev-med {
            background: rgba(255, 179, 71, .1);
            color: var(--warn);
            border-color: rgba(255, 179, 71, .3)
        }

        .sev-high {
            background: rgba(255, 77, 109, .1);
            color: var(--danger);
            border-color: rgba(255, 77, 109, .3)
        }

        .sev-crit {
            background: rgba(255, 20, 60, .18);
            color: #ff7088;
            border-color: rgba(255, 20, 60, .5);
            box-shadow: 0 0 12px rgba(255, 20, 60, .25)
        }

        /* ============ FORMS ============ */
        .form-group {
            margin-bottom: 16px
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
            letter-spacing: .02em
        }

        .form-input {
            width: 100%;
            padding: 10px 13px;
            background: var(--bg-2);
            border: 1px solid var(--border-bright);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--mono);
            font-size: 13.5px;
            outline: none;
            transition: .15s
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow)
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        /* ============ MODAL ============ */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 5, 15, .75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px
        }

        .modal-backdrop.active {
            display: flex;
            animation: fadeIn .15s
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .modal {
            background: linear-gradient(180deg, var(--surface), var(--bg-2));
            border: 1px solid var(--border-bright);
            border-radius: var(--radius);
            padding: 28px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
            animation: slideUp .2s
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0
            }

            to {
                transform: translateY(0);
                opacity: 1
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px
        }

        .modal-sub {
            font-size: 12.5px;
            color: var(--text-mute);
            margin-bottom: 22px
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px
        }

        /* ============ TOAST ============ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 200
        }

        .toast {
            background: var(--surface-2);
            border: 1px solid var(--border-bright);
            border-radius: var(--radius-sm);
            padding: 13px 18px;
            font-size: 13px;
            min-width: 260px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
            animation: slideIn .25s;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .toast.success {
            border-left: 3px solid var(--success)
        }

        .toast.danger {
            border-left: 3px solid var(--danger)
        }

        .toast.info {
            border-left: 3px solid var(--primary)
        }

        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        /* ============ LINKED LIST VIZ ============ */
        .ll-chain {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0;
            padding: 20px 0
        }

        .ll-node {
            background: linear-gradient(180deg, var(--surface-2), var(--surface));
            border: 1px solid var(--border-bright);
            border-radius: 10px;
            padding: 12px 14px;
            min-width: 130px;
            font-family: var(--mono);
            font-size: 12px;
            position: relative;
            transition: .2s
        }

        .ll-node:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px)
        }

        .ll-node .n-id {
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px
        }

        .ll-node .n-ip {
            color: var(--text-dim);
            font-size: 11px
        }

        .ll-node .n-type {
            color: var(--text-mute);
            font-size: 10.5px;
            margin-top: 2px
        }

        .ll-arrow {
            color: var(--primary);
            font-size: 18px;
            padding: 0 8px;
            font-weight: 700;
            opacity: .7
        }

        .ll-arrow.bi {
            color: var(--info)
        }

        .ll-wrap-loop {
            color: var(--warn);
            font-size: 11px;
            padding: 6px 12px;
            border: 1px dashed var(--warn);
            border-radius: 20px;
            font-family: var(--mono);
            margin-left: 8px
        }

        .ll-ring {
            position: relative;
            width: 520px;
            height: 520px;
            margin: 20px auto
        }

        .ll-ring-node {
            position: absolute;
            background: linear-gradient(180deg, var(--surface-2), var(--surface));
            border: 1px solid var(--border-bright);
            border-radius: 10px;
            padding: 10px 12px;
            min-width: 110px;
            font-family: var(--mono);
            font-size: 11px;
            text-align: center;
            transform: translate(-50%, -50%);
            transition: .2s;
            z-index: 2
        }

        .ll-ring-node:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow)
        }

        .ll-ring-node .n-id {
            color: var(--primary);
            font-weight: 700;
            font-size: 12px
        }

        .ll-ring-node .n-ip {
            color: var(--text-dim);
            font-size: 10px;
            margin-top: 2px
        }

        .ll-ring-svg {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none
        }

        /* ============ QUEUE / STACK ============ */
        .qviz {
            display: flex;
            align-items: center;
            gap: 0;
            padding: 20px 0;
            min-height: 100px;
            flex-wrap: wrap
        }

        .q-label {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-mute);
            padding: 6px 10px;
            border: 1px dashed var(--border-bright);
            border-radius: 6px;
            margin: 0 6px
        }

        .q-item {
            background: linear-gradient(180deg, var(--surface-2), var(--surface));
            border: 1px solid var(--primary-dim);
            border-radius: 8px;
            padding: 10px 12px;
            font-family: var(--mono);
            font-size: 11.5px;
            min-width: 110px;
            text-align: center
        }

        .q-item .q-id {
            color: var(--primary);
            font-weight: 700
        }

        .q-item .q-type {
            color: var(--text-dim);
            font-size: 10px;
            margin-top: 2px
        }

        .stackviz {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 6px;
            padding: 20px 0;
            min-height: 200px
        }

        .stack-item {
            background: linear-gradient(180deg, var(--surface-2), var(--surface));
            border: 1px solid var(--info);
            border-radius: 8px;
            padding: 10px 18px;
            font-family: var(--mono);
            font-size: 12px;
            min-width: 200px;
            text-align: center;
            position: relative
        }

        .stack-item:last-child {
            border-color: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow)
        }

        .stack-item:last-child::before {
            content: 'TOP';
            position: absolute;
            left: -45px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 9px;
            color: var(--primary);
            letter-spacing: .1em;
            font-weight: 700
        }

        /* ============ MISC ============ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-mute)
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-mute);
            fill: none;
            stroke-width: 1.5;
            margin-bottom: 12px;
            opacity: .5
        }

        .empty-state h3 {
            font-size: 15px;
            color: var(--text-dim);
            margin-bottom: 6px
        }

        .empty-state p {
            font-size: 12.5px
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px
        }

        .spacer {
            flex: 1
        }

        .alert-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600
        }

        .alert-pill.danger {
            background: rgba(255, 77, 109, .15);
            color: var(--danger);
            border: 1px solid rgba(255, 77, 109, .4)
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px
        }

        .bar-label {
            width: 80px;
            color: var(--text-dim);
            font-family: var(--mono);
            font-size: 11.5px
        }

        .bar-track {
            flex: 1;
            height: 8px;
            background: var(--bg-2);
            border-radius: 4px;
            overflow: hidden
        }

        .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width .4s ease
        }

        .bar-count {
            width: 30px;
            text-align: right;
            color: var(--text-dim);
            font-family: var(--mono);
            font-size: 11.5px
        }

        @media (max-width:900px) {
            .app {
                grid-template-columns: 1fr
            }

            .sidebar {
                display: none
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr
            }

            .ll-ring {
                width: 340px;
                height: 340px
            }
        }

        /* ============ CAROUSEL (Added from cyberShield3) ============ */
        .carousel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            height: 100%;
        }

        .carousel-wrapper {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .arrow-btn {
            background: var(--surface-2);
            border: 1px solid var(--border-bright);
            color: var(--text);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .15s;
        }

        .arrow-btn:hover {
            background: var(--primary);
            color: #001824;
            border-color: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
        }

        .music-card {
            background: linear-gradient(180deg, var(--surface), var(--bg-2));
            border: 1px solid var(--border-bright);
            border-radius: var(--radius);
            padding: 40px;
            width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, opacity 0.3s ease;

        .music-card h2 {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 10px;
            font-family: var(--mono);
        }

        .music-card .ip {
            font-size: 20px;
            margin-bottom: 20px;
            font-family: var(--mono);
            color: var(--text);
        }

        .music-card .type {
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .music-card .severity {
            font-size: 16px;
            font-weight: bold;
            color: var(--danger);
        }

        .carousel-indicator {
            margin-top: 20px;
            color: var(--text-mute);
            font-size: 14px;
            font-family: var(--mono);
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🛡</div>

                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                        <line x1="12" y1="9" x2="12" y2="13" />
                        <line x1="12" y1="17" x2="12.01" y2="17" />
                    </svg>Suspicious IPs</a>
            </nav>
            <div class="sidebar-footer">
                <div class="status-dot"></div><span>System Online</span>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="page-title" id="pageTitle">Dashboard<span>.</span></div>
                <div class="topbar-actions">
                    <button class="btn btn-ghost btn-sm" id="demoDataBtn">Load Demo Data</button>
                    <button class="btn btn-primary" id="quickAddBtn">+ Add Event</button>
                </div>
            </header>
            <div class="content" id="content"></div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div class="modal-backdrop" id="modalBackdrop"></div>

    <script>
        // ============ STATE ============
        const state = {
            events: [],
            alertQueue: [],
            historyStack: [],
            nextId: 101,
            searchHighlight: null,
            currentView: 'dashboard',
            carouselIndex: 0 // Added for carousel
        };

        // ============ UTILS ============
        const $ = sel => document.querySelector(sel);
        const $$ = sel => document.querySelectorAll(sel);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

        function severityClass(s) {
            if (s <= 3) return 'sev-low';
            if (s <= 6) return 'sev-med';
            if (s <= 8) return 'sev-high';
            return 'sev-crit';
        }
        function severityLabel(s) {
            if (s <= 3) return 'LOW';
            if (s <= 6) return 'MED';
            if (s <= 8) return 'HIGH';
            return 'CRIT';
        }
        function sevBadge(s) {return `<span class="sev-badge ${severityClass(s)}">${severityLabel(s)} · ${s}</span>`;}

        function toast(msg, type = 'info') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = msg;
            $('#toastContainer').appendChild(el);
            setTimeout(() => {el.style.transition = '.3s'; el.style.opacity = '0'; el.style.transform = 'translateX(120%)'; setTimeout(() => el.remove(), 300);}, 2800);
        }

        // ============ SORTING ============
        function insertionSortById(arr) {
            const a = [...arr];
            for (let i = 1; i < a.length; i++) {
                let j = i;
                while (j > 0 && a[j - 1].id > a[j].id) {[a[j - 1], a[j]] = [a[j], a[j - 1]]; j--;}
            }
            return a;
        }
        function selectionSortBySeverity(arr) {
            const a = [...arr];
            for (let i = 0; i < a.length; i++) {
                let min = i;
                for (let j = i + 1; j < a.length; j++) if (a[min].severity > a[j].severity) min = j;
                [a[i], a[min]] = [a[min], a[i]];
            }
            return a;
        }
        function bubbleSortById(arr) {
            const a = [...arr];
            for (let i = 0; i < a.length - 1; i++)
                for (let j = 0; j < a.length - i - 1; j++)
                    if (a[j].id > a[j + 1].id) [a[j], a[j + 1]] = [a[j + 1], a[j]];
            return a;
        }
        function binarySearchById(arr, target) {
            let lo = 0, hi = arr.length - 1;
            while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                if (arr[mid].id === target) return mid;
                if (target < arr[mid].id) hi = mid - 1;
                else lo = mid + 1;
            }
            return -1;
        }

        // ============ CAROUSEL LOGIC (Added) ============
        window.renderCarousel = function () {
            const card = $('#music-card');
            const indicator = $('#carousel-indicator');
            if (!card || !indicator) return;

            if (state.events.length === 0) {
                card.innerHTML = '<div class="empty-state" style="padding:20px;"><h3>No events loaded</h3><p>Add events to view</p></div>';
                indicator.innerText = '0 / 0';
                return;
            }

            if (state.carouselIndex >= state.events.length) state.carouselIndex = 0;
            if (state.carouselIndex < 0) state.carouselIndex = state.events.length - 1;

            const e = state.events[state.carouselIndex];

            card.innerHTML = `
          <h2>#${e.id}</h2>
          <div class="ip">${esc(e.ip)}</div>
          <div class="type">${esc(e.type)}</div>
          <div class="severity" style="color: ${e.severity >= 9 ? 'var(--danger)' : 'var(--warn)'}">Severity: ${e.severity}</div>
      `;
            indicator.innerText = `${state.carouselIndex + 1} / ${state.events.length}`;
        };

        window.nextEvent = function () {
            if (state.events.length === 0) return;
            state.carouselIndex = (state.carouselIndex + 1) % state.events.length;
            renderCarousel();
        };

        window.prevEvent = function () {
            if (state.events.length === 0) return;
            state.carouselIndex = (state.carouselIndex - 1 + state.events.length) % state.events.length;
            renderCarousel();
        };
        // ===============================================

        // ============ VIEW RENDERERS ============
        const views = {};

        views.dashboard = () => {
            const total = state.events.length;
            const avg = total ? (state.events.reduce((s, e) => s + e.severity, 0) / total).toFixed(1) : '0.0';
            const uniqueIps = new Set(state.events.map(e => e.ip)).size;
            const critical = state.events.filter(e => e.severity >= 9).length;
            const recent = [...state.events].slice(-5).reverse();
            const severityBuckets = [0, 0, 0, 0];
            state.events.forEach(e => {severityBuckets[e.severity <= 3 ? 0 : e.severity <= 6 ? 1 : e.severity <= 8 ? 2 : 3]++;});
            const maxBucket = Math.max(...severityBuckets, 1);
            const colors = ['var(--success)', 'var(--warn)', 'var(--danger)', '#ff2040'];
            const labels = ['Low (1-3)', 'Medium (4-6)', 'High (7-8)', 'Critical (9-10)'];

            return `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Events</div><div class="stat-value">${total}</div><div class="stat-foot">Stored in vector</div></div>
      <div class="stat-card warn"><div class="stat-label">Avg Severity</div><div class="stat-value">${avg}</div><div class="stat-foot">Out of 10</div></div>
      <div class="stat-card success"><div class="stat-label">Unique IPs</div><div class="stat-value">${uniqueIps}</div><div class="stat-foot">Sources seen</div></div>
      <div class="stat-card danger"><div class="stat-label">Critical</div><div class="stat-value">${critical}</div><div class="stat-foot">Severity ≥ 9</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:20px">
      <div class="card">
        <div class="card-header"><div><div class="card-title">Recent Events</div><div class="card-sub">Last 5 captured</div></div></div>
        ${recent.length ? `<table class="data-table"><thead><tr><th>ID</th><th>IP</th><th>Type</th><th>Severity</th></tr></thead><tbody>
          ${recent.map(e => `<tr><td>#${e.id}</td><td>${esc(e.ip)}</td><td>${esc(e.type)}</td><td>${sevBadge(e.severity)}</td></tr>`).join('')}
        </tbody></table>` : `<div class="empty-state"><h3>No events yet</h3><p>Click "+ Add Event" or "Load Demo Data" to begin</p></div>`}
      </div>
      <div class="card">
        <div class="card-header"><div><div class="card-title">Severity Distribution</div><div class="card-sub">By bucket</div></div></div>
        <div class="bar-chart">
          ${severityBuckets.map((c, i) => `
            <div class="bar-row">
              <div class="bar-label">${labels[i].split(' ')[0]}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${(c / maxBucket * 100).toFixed(0)}%;background:${colors[i]}"></div></div>
              <div class="bar-count">${c}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
        };

        // Added Carousel View
        views.carousel = () => {
            return `
      <div class="carousel-container">
          <div class="carousel-wrapper">
              <button class="arrow-btn" onclick="prevEvent()">❮</button>
              <div class="music-card" id="music-card">
                  <div class="empty-state" style="padding:20px;"><h3>No events loaded</h3><p>Add events to view</p></div>
              </div>
              <button class="arrow-btn" onclick="nextEvent()">❯</button>
          </div>
          <div class="carousel-indicator" id="carousel-indicator">0 / 0</div>
      </div>`;
        };

        views.events = () => {
            const events = state.events;
            return `
    <div class="toolbar">
      <button class="btn btn-primary" id="addEventBtn">+ Add Event</button>
      <button class="btn" id="sortIdBtn">Sort by ID (Bubble)</button>
      <button class="btn" id="sortSevBtn">Sort by Severity (Selection)</button>
      <button class="btn" id="searchBtn">Search Event</button>
      <div class="spacer"></div>
      <span style="color:var(--text-mute);font-size:12px;font-family:var(--mono)">${events.length} event(s)</span>
    </div>
    ${events.length ? `
      <div class="card" style="padding:0;overflow:hidden">
        <table class="data-table">
          <thead><tr><th>Event ID</th><th>IP Address</th><th>Event Type</th><th>Severity</th><th></th></tr></thead>
          <tbody>
            ${events.map((e, i) => `
              <tr class="${state.searchHighlight === e.id ? 'highlight' : ''}">
                <td>#${e.id}</td>
                <td>${esc(e.ip)}</td>
                <td>${esc(e.type)}</td>
                <td>${sevBadge(e.severity)}</td>
                <td><button class="btn btn-ghost btn-sm" data-del="${i}">Delete</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : `
      <div class="card"><div class="empty-state">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>
        <h3>No security events</h3><p>Add your first event to populate the vector</p>
      </div></div>`}`;
        };

        views.singly = () => {
            if (!state.events.length) return emptyViz('Singly Linked List', 'No events to build a list from');
            const nodes = state.events.map((e, i) => `
    <div class="ll-node">
      <div class="n-id">#${e.id}</div>
      <div class="n-ip">${esc(e.ip)}</div>
      <div class="n-type">${esc(e.type)} · sev ${e.severity}</div>
    </div>${i < state.events.length - 1 ? '<div class="ll-arrow">→</div>' : '<div class="ll-arrow">→</div><div class="ll-wrap-loop">NULL</div>'}
  `).join('');
            return `<div class="card"><div class="card-header"><div><div class="card-title">Singly Linked List</div><div class="card-sub">Each node points to the next · tail → null</div></div></div><div class="ll-chain">${nodes}</div></div>`;
        };

        views.doubly = () => {
            if (!state.events.length) return emptyViz('Doubly Linked List', 'No events to build a list from');
            const nodes = state.events.map((e, i) => `
    <div class="ll-node">
      <div class="n-id">#${e.id}</div>
      <div class="n-ip">${esc(e.ip)}</div>
      <div class="n-type">${esc(e.type)} · sev ${e.severity}</div>
    </div>${i < state.events.length - 1 ? '<div class="ll-arrow bi">⇄</div>' : ''}
  `).join('');
            return `<div class="card"><div class="card-header"><div><div class="card-title">Doubly Linked List</div><div class="card-sub">Each node points to next and previous</div></div></div><div class="ll-chain"><div class="ll-wrap-loop" style="border-color:var(--text-mute);color:var(--text-mute)">NULL ←</div>${nodes}<div class="ll-wrap-loop" style="border-color:var(--text-mute);color:var(--text-mute)">→ NULL</div></div></div>`;
        };

        views.circular = () => {
            if (!state.events.length) return emptyViz('Circular Linked List', 'No events to build a list from');
            const n = state.events.length;
            const size = 520, cx = size / 2, cy = size / 2, r = 190;
            let nodesHtml = '', svgPaths = '';
            state.events.forEach((e, i) => {
                const angle = (2 * Math.PI * i / n) - Math.PI / 2;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                nodesHtml += `<div class="ll-ring-node" style="left:${x}px;top:${y}px">
      <div class="n-id">#${e.id}</div><div class="n-ip">${esc(e.ip)}</div>
    </div>`;
                // arc from this node to next
                const na = (2 * Math.PI * ((i + 1) % n) / n) - Math.PI / 2;
                const nx = cx + r * Math.cos(na), ny = cy + r * Math.sin(na);
                svgPaths += `<line x1="${x}" y1="${y}" x2="${nx}" y2="${ny}" stroke="rgba(0,212,255,.35)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
            });
            return `<div class="card"><div class="card-header"><div><div class="card-title">Circular Linked List</div><div class="card-sub">Last node points back to the first</div></div></div>
    <div class="ll-ring">${nodesHtml}<svg class="ll-ring-svg" viewBox="0 0 ${size} ${size}">${svgPaths}</svg></div></div>`;
        };

        views.queue = () => {
            const q = state.alertQueue;
            return `<div class="card">
    <div class="card-header"><div><div class="card-title">Alert Queue</div><div class="card-sub">FIFO · enqueue at rear, dequeue from front</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" id="enqueueBtn">Enqueue</button>
        <button class="btn btn-danger btn-sm" id="dequeueBtn" ${!q.length ? 'disabled' : ''}>Dequeue</button>
      </div>
    </div>
    <div class="qviz">
      <div class="q-label">DEQUEUE ←</div>
      ${q.length ? q.map((e, i) => `<div class="q-item"><div class="q-id">#${e.id}</div><div class="q-type">${esc(e.type)}</div></div>${i < q.length - 1 ? '<div style="color:var(--text-mute);padding:0 6px">·</div>' : ''}`).join('') : '<div style="color:var(--text-mute);padding:0 20px">empty queue</div>'}
      <div class="q-label">← ENQUEUE</div>
    </div></div>`;
        };

        views.stack = () => {
            const st = state.historyStack;
            return `<div class="card">
    <div class="card-header"><div><div class="card-title">History Stack</div><div class="card-sub">LIFO · push and pop from the top</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" id="pushBtn">Push</button>
        <button class="btn btn-danger btn-sm" id="popBtn" ${!st.length ? 'disabled' : ''}>Pop</button>
      </div>
    </div>
    <div class="stackviz">
      ${st.length ? st.map(e => `<div class="stack-item">#${e.id} · ${esc(e.type)} · sev ${e.severity}</div>`).join('') : '<div style="color:var(--text-mute);padding:40px 0">empty stack</div>'}
    </div></div>`;
        };

        views.suspicious = () => {
            const counts = {};
            state.events.forEach(e => {counts[e.ip] = (counts[e.ip] || 0) + 1;});
            const flagged = Object.entries(counts).filter(([ip, c]) => c >= 2).sort((a, b) => b[1] - a[1]);
            return `<div class="card">
    <div class="card-header"><div><div class="card-title">Suspicious IP Detection</div><div class="card-sub">IPs appearing ≥ 2 times across events</div></div>
      <span class="alert-pill danger">${flagged.length} flagged</span>
    </div>
    ${flagged.length ? `<table class="data-table"><thead><tr><th>IP Address</th><th>Occurrences</th><th>Types</th><th>Status</th></tr></thead><tbody>
      ${flagged.map(([ip, c]) => {
                const types = [...new Set(state.events.filter(e => e.ip === ip).map(e => e.type))].join(', ');
                return `<tr><td style="color:var(--danger)">${esc(ip)}</td><td>${c}</td><td>${esc(types)}</td><td><span class="alert-pill danger">⚠ FLAGGED</span></td></tr>`;
            }).join('')}
    </tbody></table>` : `<div class="empty-state"><h3>All clear</h3><p>No IP appears more than once</p></div>`}
  </div>`;
        };

        function emptyViz(title, msg) {
            return `<div class="card"><div class="card-header"><div><div class="card-title">${title}</div><div class="card-sub">${msg}</div></div></div>
    <div class="empty-state"><h3>Nothing to display</h3><p>Add events first to see the visualization</p></div></div>`;
        }

        // ============ ROUTER ============
        const titles = {
            dashboard: 'Dashboard',
            carousel: 'Display All Events', // Added Carousel Title
            events: 'Security Events',
            singly: 'Singly Linked List',
            doubly: 'Doubly Linked List',
            circular: 'Circular Linked List',
            queue: 'Alert Queue',
            stack: 'History Stack',
            suspicious: 'Suspicious IPs'
        };

        function go(view) {
            state.currentView = view;
            $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
            $('#pageTitle').innerHTML = titles[view] + '<span>.</span>';
            $('#content').innerHTML = views[view]();
            bindViewActions(view);
        }

        function bindViewActions(view) {
            // Render carousel if we are on that view
            if (view === 'carousel') {
                renderCarousel();
            }

            // delete buttons in events view
            $$('[data-del]').forEach(b => b.addEventListener('click', () => {
                const i = +b.dataset.del;
                const removed = state.events.splice(i, 1)[0];
                toast(`Deleted event #${removed.id}`, 'danger');
                go('events');
            }));
            if (view === 'events') {
                $('#addEventBtn')?.addEventListener('click', () => openAddModal());
                $('#sortIdBtn')?.addEventListener('click', () => {state.events = bubbleSortById(state.events); toast('Sorted by ID (bubble sort)', 'success'); go('events');});
                $('#sortSevBtn')?.addEventListener('click', () => {state.events = selectionSortBySeverity(state.events); toast('Sorted by severity (selection sort)', 'success'); go('events');});
                $('#searchBtn')?.addEventListener('click', () => openSearchModal());
            }
            if (view === 'queue') {
                $('#enqueueBtn')?.addEventListener('click', () => {
                    if (!state.events.length) {toast('Add events first', 'danger'); return;}
                    const e = state.events[Math.floor(Math.random() * state.events.length)];
                    state.alertQueue.push(e);
                    toast(`Enqueued #${e.id} to alert queue`, 'info'); go('queue');
                });
                $('#dequeueBtn')?.addEventListener('click', () => {
                    const e = state.alertQueue.shift();
                    toast(`Dequeued #${e.id}`, 'success'); go('queue');
                });
            }
            if (view === 'stack') {
                $('#pushBtn')?.addEventListener('click', () => {
                    if (!state.events.length) {toast('Add events first', 'danger'); return;}
                    const e = state.events[Math.floor(Math.random() * state.events.length)];
                    state.historyStack.push(e);
                    toast(`Pushed #${e.id} to history`, 'info'); go('stack');
                });
                $('#popBtn')?.addEventListener('click', () => {
                    const e = state.historyStack.pop();
                    toast(`Popped #${e.id}`, 'success'); go('stack');
                });
            }
        }

        // ============ MODALS ============
        function openAddModal() {
            const next = state.nextId;
            $('#modalBackdrop').innerHTML = `
    <div class="modal">
      <div class="modal-title">Add Security Event</div>
      <div class="modal-sub">The new event will be pushed onto the vector</div>
      <form id="addForm">
        <div class="form-row">
          <div class="form-group"><label class="form-label">Event ID</label><input class="form-input" name="id" type="number" value="${next}" required></div>
          <div class="form-group"><label class="form-label">Severity (1-10)</label><input class="form-input" name="severity" type="number" min="1" max="10" value="5" required></div>
        </div>
        <div class="form-group"><label class="form-label">IP Address</label><input class="form-input" name="ip" placeholder="192.168.1.1" required></div>
        <div class="form-group"><label class="form-label">Event Type</label><input class="form-input" name="type" placeholder="Brute Force / DDoS / Phishing..." required></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Event</button>
        </div>
      </form>
    </div>`;
            $('#modalBackdrop').classList.add('active');
            $('#cancelModal').addEventListener('click', closeModal);
            $('#addForm').addEventListener('submit', ev => {
                ev.preventDefault();
                const fd = new FormData(ev.target);
                const evt = {id: +fd.get('id'), ip: fd.get('ip').trim(), type: fd.get('type').trim(), severity: +fd.get('severity')};
                if (state.events.some(e => e.id === evt.id)) {toast('Event ID already exists', 'danger'); return;}
                state.events.push(evt);
                state.nextId = Math.max(state.nextId, evt.id + 1);
                closeModal();
                toast(`Event #${evt.id} added`, 'success');
                go(state.currentView);
            });
        }

        function openSearchModal() {
            $('#modalBackdrop').innerHTML = `
    <div class="modal">
      <div class="modal-title">Search Event by ID</div>
      <div class="modal-sub">Insertion sort + binary search (matching your C++)</div>
      <form id="searchForm">
        <div class="form-group"><label class="form-label">Event ID</label><input class="form-input" name="id" type="number" autofocus required></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </form>
    </div>`;
            $('#modalBackdrop').classList.add('active');
            $('#cancelModal').addEventListener('click', closeModal);
            $('#searchForm').addEventListener('submit', ev => {
                ev.preventDefault();
                const target = +new FormData(ev.target).get('id');
                const sorted = insertionSortById(state.events);
                const idx = binarySearchById(sorted, target);
                closeModal();
                if (idx >= 0) {state.searchHighlight = target; toast(`Found #${target} at index ${idx}`, 'success');}
                else {state.searchHighlight = null; toast(`Event #${target} not found`, 'danger');}
                go('events');
            });
        }

        function closeModal() {$('#modalBackdrop').classList.remove('active');}
        $('#modalBackdrop').addEventListener('click', e => {if (e.target.id === 'modalBackdrop') closeModal();});

        // ============ DEMO DATA ============
        function loadDemoData() {
            const demo = [
                {id: 101, ip: '192.168.1.45', type: 'Brute Force', severity: 9},
                {id: 102, ip: '10.0.0.12', type: 'Port Scan', severity: 4},
                {id: 103, ip: '192.168.1.45', type: 'Malware', severity: 8},
                {id: 104, ip: '172.16.0.7', type: 'SQL Injection', severity: 7},
                {id: 105, ip: '10.0.0.12', type: 'Phishing', severity: 5},
                {id: 106, ip: '192.168.1.45', type: 'DDoS', severity: 10},
                {id: 107, ip: '203.0.113.5', type: 'XSS', severity: 6},
            ];
            state.events = demo;
            state.nextId = 108;
            state.searchHighlight = null;
            state.alertQueue = [];
            state.historyStack = [];
            state.carouselIndex = 0; // Reset carousel
            toast('Demo data loaded', 'success');
            go('dashboard');
        }

        // ============ WIREUP ============
        $('#nav').addEventListener('click', e => {
            const item = e.target.closest('.nav-item');
            if (item) go(item.dataset.view);
        });
        $('#quickAddBtn').addEventListener('click', () => openAddModal());
        $('#demoDataBtn').addEventListener('click', loadDemoData);
        document.addEventListener('keydown', e => {if (e.key === 'Escape') closeModal();});

        // boot
        go('dashboard');
    </script>
</body>

</html>
